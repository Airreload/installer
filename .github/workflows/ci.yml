name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell syntax
        run: bash -n install.sh uninstall.sh tests/test_installer.sh
      - name: Run ShellCheck
        run: shellcheck install.sh uninstall.sh tests/test_installer.sh
      - name: Run isolated tests
        run: bash tests/test_installer.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check PowerShell syntax
        shell: powershell
        run: |
          $allErrors = foreach ($file in @('install.ps1', 'uninstall.ps1', 'tests\test_installer.ps1')) {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$null, [ref]$parseErrors)
            $parseErrors
          }
          if ($allErrors) { $allErrors | Format-List; exit 1 }
      - name: Run isolated Windows tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_installer.ps1

  real-install:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install from pinned public tags
        env:
          AIRRELOAD_INSTALL_ROOT: ${{ runner.temp }}/airreload-smoke
        run: ./install.sh --no-path
      - name: Verify commands
        env:
          AIRRELOAD_INSTALL_ROOT: ${{ runner.temp }}/airreload-smoke
        run: |
          "$AIRRELOAD_INSTALL_ROOT/bin/airreload" version
          "$AIRRELOAD_INSTALL_ROOT/bin/airreload" --help
          "$AIRRELOAD_INSTALL_ROOT/bin/airreload" doctor
      - name: Uninstall cleanly
        env:
          AIRRELOAD_INSTALL_ROOT: ${{ runner.temp }}/airreload-smoke
        run: |
          ./uninstall.sh --yes
          test ! -e "$AIRRELOAD_INSTALL_ROOT"

  real-install-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install from pinned public tags
        shell: powershell
        env:
          AIRRELOAD_INSTALL_ROOT: ${{ runner.temp }}\airreload-smoke
        run: .\install.ps1 -NoPath
      - name: Verify commands
        shell: powershell
        env:
          AIRRELOAD_INSTALL_ROOT: ${{ runner.temp }}\airreload-smoke
        run: |
          & "$env:AIRRELOAD_INSTALL_ROOT\bin\airreload.cmd" version
          & "$env:AIRRELOAD_INSTALL_ROOT\bin\airreload.cmd" --help
          & "$env:AIRRELOAD_INSTALL_ROOT\bin\airreload.cmd" doctor
      - name: Uninstall cleanly
        shell: powershell
        env:
          AIRRELOAD_INSTALL_ROOT: ${{ runner.temp }}\airreload-smoke
        run: |
          .\uninstall.ps1 -Yes
          if (Test-Path -LiteralPath $env:AIRRELOAD_INSTALL_ROOT) { throw 'Install root was not removed.' }
