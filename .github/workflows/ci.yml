name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      isolated_only:
        description: Run isolated installer tests before release assets are published
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell syntax
        run: bash -n install.sh uninstall.sh tests/test_installer.sh
      - name: Run ShellCheck
        run: shellcheck install.sh uninstall.sh tests/test_installer.sh
      - name: Run isolated tests
        run: bash tests/test_installer.sh

  powershell:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check PowerShell syntax
        shell: powershell
        run: |
          $allErrors = foreach ($file in (Get-ChildItem -Path . -Filter *.ps1 -Recurse).FullName) {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$null, [ref]$parseErrors)
            $parseErrors
          }
          if ($allErrors) { $allErrors | Format-List; exit 1 }
      - name: Run isolated Windows tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_installer.ps1

  real-install:
    if: ${{ !inputs.isolated_only }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned native release
        env:
          AIRRELOAD_INSTALL_ROOT: ${{ runner.temp }}/airreload-smoke
        run: ./install.sh --no-path
      - name: Verify piped installation in a separate directory
        env:
          AIRRELOAD_INSTALL_ROOT: ${{ runner.temp }}/airreload-piped-smoke
          AIRRELOAD_TEST_PROFILE_FILE: ${{ runner.temp }}/airreload-piped-profile
        run: |
          cat install.sh | bash -s -- --no-path
          "$AIRRELOAD_INSTALL_ROOT/bin/airreload" version
          test ! -e "$AIRRELOAD_INSTALL_ROOT/flutter"
          test ! -e "$AIRRELOAD_INSTALL_ROOT/sdks"
          ./uninstall.sh --yes
          test ! -e "$AIRRELOAD_INSTALL_ROOT"
      - name: Verify commands
        env:
          AIRRELOAD_INSTALL_ROOT: ${{ runner.temp }}/airreload-smoke
        run: |
          "$AIRRELOAD_INSTALL_ROOT/bin/airreload" version
          "$AIRRELOAD_INSTALL_ROOT/bin/airreload" --help
          "$AIRRELOAD_INSTALL_ROOT/bin/airreload" doctor
          test ! -e "$AIRRELOAD_INSTALL_ROOT/flutter"
          test ! -e "$AIRRELOAD_INSTALL_ROOT/sdks"
          test ! -e "$AIRRELOAD_INSTALL_ROOT/cli/.dart_tool"
      - name: Uninstall cleanly
        env:
          AIRRELOAD_INSTALL_ROOT: ${{ runner.temp }}/airreload-smoke
        run: |
          ./uninstall.sh --yes
          test ! -e "$AIRRELOAD_INSTALL_ROOT"

  real-install-windows:
    if: ${{ !inputs.isolated_only }}
    name: Windows install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify first install, saved PATH, and uninstall with restricted tools
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\test_real_install_windows.ps1
